<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('台站核点卡立卡')"/>
</head>
<body>
<form class="layui-form">
    <div class="mainBox">
        <div class="main-container">
            <!-- 卡号、还欠、当前档、签认号：一律系统发/系统折，卡面上没有给人填的位置 -->
            <div class="layui-form-item">
                <label class="layui-form-label">所属台站</label>
                <div class="layui-input-block">
                    <select name="siteId" lay-verify="required">
                        <option value="">请选择在册台站（已关停的不收新卡）</option>
                        <option th:each="s : ${siteList}" th:value="${s.id}"
                                th:text="${s.siteNo} + '｜' + ${s.siteName} + '（' + ${s.siteType} + '）'"></option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">挂在哪一层</label>
                <div class="layui-input-block">
                    <select name="nodeNo">
                        <option value="0">省局</option>
                        <option value="1">市局</option>
                        <option value="2" selected>县局</option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">应核点位数</label>
                <div class="layui-input-block">
                    <input type="text" name="shouldCount" autocomplete="off" placeholder="非负整数，如 37" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">已核点位数</label>
                <div class="layui-input-block">
                    <input type="text" name="doneCount" autocomplete="off" placeholder="非负整数，不得大过应核，如 30" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">随卡要件</label>
                <div class="layui-input-block">
                    <textarea name="content" placeholder="随卡交来的属地要件" class="layui-textarea"></textarea>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-input-block">
                    <span class="layui-badge layui-bg-gray">卡号由系统发出；还欠点位数由应核-已核折出，只读不写；新卡落"待核"。</span>
                </div>
            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit lay-filter="card-save">
                <i class="layui-icon layui-icon-ok"></i> 递卡
            </button>
            <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm">重置</button>
        </div>
    </div>
</form>
<th:block th:include="include :: footer"/>
<script>
    layui.use(['form', 'jquery'], function () {
        let form = layui.form;
        let $ = layui.jquery;
        let MODULE_PATH = rootPath + "/BcastUnitCardController";
        form.on('submit(card-save)', function (data) {
            $.ajax({
                url: MODULE_PATH + '/add',
                data: data.field,
                dataType: 'json',
                type: 'post',
                success: function (r) {
                    layer.msg(r.msg, {icon: r.code === 200 ? 1 : 2, time: 1600}, function () {
                        if (r.code === 200) {
                            parent.layer.close(parent.layer.getFrameIndex(window.name));
                            parent.layui.table.reload("unit-card-table");
                        }
                    });
                }
            });
            return false;
        });
    });
</script>
</body>
</html>
